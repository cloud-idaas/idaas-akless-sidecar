# Bootstrap identity for IDaaS OIDC federation; no Kubernetes API role is required.
# Match the namespace/SA subject in the IDaaS federated credential and authorize
# the cloud roles needed by this workload. The Deployment projects its own token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idaas-akless-demo
  namespace: idaas-akless
  labels:
    app.kubernetes.io/name: idaas-akless-sidecar
automountServiceAccountToken: false
